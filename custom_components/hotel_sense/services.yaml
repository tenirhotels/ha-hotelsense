ap_area_report:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mapping:
      example: '{"AA-BB-CC-DD-EE-01": "Room 01"}'
      selector:
        object:
    csv:
      selector:
        text:
          multiline: true

assign_ap_areas:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mapping:
      example: '{"AA-BB-CC-DD-EE-01": "Room 01"}'
      selector:
        object:
    csv:
      selector:
        text:
          multiline: true
    create_missing_areas:
      default: false
      selector:
        boolean:

import_devices:
  fields:
    csv:
      required: true
      selector:
        text:
          multiline: true
    replace:
      default: false
      selector:
        boolean:
    default_category:
      selector:
        select:
          options:
            - fixed
            - employee
          translation_key: category

export_devices:

reconnect_client:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mac:
      required: true
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:

block_client:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mac:
      required: true
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:

unblock_client:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mac:
      required: true
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:

ap_ssids:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    access_point:
      example: "Room 03"
      selector:
        text:

set_ap_ssid:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    access_point:
      required: true
      example: "Room 03"
      selector:
        text:
    ssid:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

exely_api_probe:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    booking:
      example: "20261006-9999-123456"
      selector:
        text:

room_report:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    room:
      required: true
      example: "06"
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    hours:
      default: 24
      selector:
        number:
          min: 1
          max: 8784
          mode: box

hotel_report:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    hours:
      default: 24
      selector:
        number:
          min: 1
          max: 8784
          mode: box
device_route:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    mac:
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:
    identity:
      example: "EMP-0007"
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    hours:
      default: 24
      selector:
        number:
          min: 1
          max: 8784
          mode: box
device_candidates:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    days:
      default: 14
      selector:
        number:
          min: 1
          max: 366
          mode: box
    min_days:
      default: 5
      selector:
        number:
          min: 1
          max: 366
          mode: box
    min_rooms_per_day:
      default: 3
      selector:
        number:
          min: 2
          max: 100
          mode: box
omada_known_devices:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotel_sense
    min_hours:
      default: 500
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    seen_days:
      default: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    wired:
      default: false
      selector:
        boolean:
link_mac:
  fields:
    identity:
      required: true
      example: "EMP-0007"
      selector:
        text:
    mac:
      required: true
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:
unlink_mac:
  fields:
    mac:
      required: true
      example: "AA-BB-CC-DD-EE-FF"
      selector:
        text:
