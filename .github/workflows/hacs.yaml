name: HACS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The Omada client comes from zachcheatham/ha-omada, which has no license
          # (see NOTICE.md), so no LICENSE can be added for the whole repository.
          ignore: license
