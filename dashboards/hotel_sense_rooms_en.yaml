# Hotel Sense - rooms matrix. Generated by scripts/generate_dashboard.py, do not edit by hand.
# Add in HA: Settings -> Dashboards -> Add dashboard -> New dashboard from scratch ->
# (three dots) Edit -> Raw configuration editor -> paste this file.
title: Hotel Sense
views:
  - title: Rooms
    path: rooms
    icon: mdi:bed
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            content: |
              {%- set v = integration_entities('hotel_sense') | select('match', 'binary_sensor\\..*_violation$') | select('is_state', 'on') | list -%}
              {% if v | count %}<ha-alert alert-type="error" title="Possible violations: {{ v | count }}">{{ v | map('device_attr', 'name') | join(', ') }}</ha-alert>
              {% else %}<ha-alert alert-type="success">No violations</ha-alert>
              {% endif %}
              {%- set m = state_attr('sensor.hotel_sense_misplaced_devices', 'devices') or [] %}
              {%- if m %}
              <ha-alert alert-type="warning" title="Equipment out of place: {{ m | count }}">{% for d in m %}{{ d.name }}: expected in {{ d.expected }}, seen in {{ d.seen }}<br>{% endfor %}</ha-alert>
              {%- endif %}
      - type: grid
        cards:
          - type: markdown
            content: |
              {%- set st = states('sensor.room_01_state') -%}
              {%- set g = states('sensor.room_01_guest_devices') -%}
              {%- set e = states('sensor.room_01_employee_devices') -%}
              {%- set f = states('sensor.room_01_fixed_devices') -%}
              {%- set label = {'empty': 'Empty', 'violation': 'VIOLATION', 'staff_visit': 'Staff visit', 'checked_in': 'Checked in'}.get(st, st) -%}
              {%- set kind = {'violation': 'error', 'staff_visit': 'info'}.get(st) -%}
              {%- set line = 'Guests: ' ~ g ~ ' · Staff: ' ~ e ~ ' · Fixed: ' ~ f -%}
              {% if kind %}<ha-alert alert-type="{{ kind }}" title="Room 01 — {{ label }}">{{ line }}</ha-alert>
              {% else %}**Room 01** — {{ label }}<br>{{ line }}
              {% endif %}
              {%- if state_attr('sensor.room_01_state', 'data_stale') %}
              <ha-alert alert-type="warning">Controller unreachable: data as of the connection loss</ha-alert>
              {%- endif %}
          - type: tile
            entity: select.room_01_status
            name: Status
            hide_state: true
            grid_options:
              columns: full
            features_position: bottom
            features:
              - type: select-options
      - type: grid
        cards:
          - type: markdown
            content: |
