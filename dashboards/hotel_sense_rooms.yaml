# Hotel Sense - rooms matrix. Generated by scripts/generate_dashboard.py, do not edit by hand.
# Add in HA: Settings -> Dashboards -> Add dashboard -> New dashboard from scratch ->
# (three dots) Edit -> Raw configuration editor -> paste this file.
title: Hotel Sense
views:
  - title: Номера
    path: rooms
    icon: mdi:bed
    type: masonry
    cards:
      - type: markdown
        content: |
          {%- set v = integration_entities('hotel_sense') | select('match', 'binary_sensor\\..*_violation$') | select('is_state', 'on') | list -%}
          {% if v | count %}<ha-alert alert-type="error" title="Возможные нарушения: {{ v | count }}">{{ v | map('device_attr', 'name') | join(', ') }}</ha-alert>
          {% else %}<ha-alert alert-type="success">Нарушений нет</ha-alert>
          {% endif %}
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              {%- set st = states('sensor.room_01_state') -%}
              {%- set g = states('sensor.room_01_guest_devices') -%}
              {%- set e = states('sensor.room_01_employee_devices') -%}
              {%- set f = states('sensor.room_01_fixed_devices') -%}
              {%- set label = {'empty': 'Пусто', 'violation': 'НАРУШЕНИЕ', 'staff_visit': 'Визит сотрудника', 'sold': 'Продан', 'cleaning_not_started': 'Уборка не началась', 'cleaning_in_progress': 'Идёт уборка'}.get(st, st) -%}
              {%- set kind = {'violation': 'error', 'cleaning_not_started': 'warning', 'staff_visit': 'info', 'cleaning_in_progress': 'info'}.get(st) -%}
              {%- set line = 'Гости: ' ~ g ~ ' · Сотрудники: ' ~ e ~ ' · Фикс.: ' ~ f -%}
              {% if kind %}<ha-alert alert-type="{{ kind }}" title="Room 01 — {{ label }}">{{ line }}</ha-alert>
              {% else %}**Room 01** — {{ label }}<br>{{ line }}
              {% endif %}
              {%- if state_attr('sensor.room_01_state', 'data_stale') %}
              <ha-alert alert-type="warning">Нет связи с контроллером: данные на момент потери связи</ha-alert>
              {%- endif %}
          - type: tile
            entity: select.room_01_status
            name: Статус
            hide_state: true
            features:
              - type: select-options
      - type: vertical-stack
        cards:
          - type: markdown
